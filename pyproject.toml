[project]
name = "my-only-chat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44.0,<47.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv==1.0.1",
    "PyYAML>=6.0,<7.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["app.py"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
